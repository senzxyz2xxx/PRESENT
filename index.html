<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbeef1">
  <meta name="description" content="เปิดงานนำเสนอและ UI Design ในที่เดียว">
  <title>PRESENT</title>
  <style>
    :root{color-scheme:light;--ink:#522d3e;--muted:#886674;--pink:#b94b76;--line:#e8cdd7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;background:#fbeef1;background-image:radial-gradient(ellipse at 5% 15%,#ffe0e9 0,transparent 47%),radial-gradient(ellipse at 100% 90%,#f4dce8 0,transparent 45%)}
    body:before{content:"";position:fixed;inset:16px;border:1px solid #dcb4c3;border-radius:24px;pointer-events:none}
    .shell{width:min(1010px,100% - 96px);margin:auto;min-height:100svh;display:flex;flex-direction:column}
    header{padding:43px 0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}
    .wordmark{font-size:14px;font-weight:750;letter-spacing:.22em}
    .header-note{font-size:11px;letter-spacing:.16em;color:var(--muted)}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:53px 0 58px}
    .intro{position:relative;margin-bottom:43px}
    .eyebrow{display:flex;gap:9px;align-items:center;color:var(--pink);font-size:11px;letter-spacing:.24em;font-weight:600}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--pink)}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(59px,12vw,132px);font-weight:400;letter-spacing:-.055em;line-height:1.03;margin:15px 0 18px}
    .intro p{margin:0;font-size:15px;color:var(--muted);line-height:1.8}
    .bloom{position:absolute;right:26px;top:9px;width:108px;height:108px;color:#d28ba7;transform:rotate(12deg)}
    .links{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .card{position:relative;text-decoration:none;color:inherit;padding:29px 30px 27px;border:1px solid #e5becd;border-radius:22px;background:#fff9fbab;box-shadow:0 10px 30px #78435a05;transition:transform .22s,border-color .22s,box-shadow .22s;display:flex;flex-direction:column;min-height:260px}
    .card:nth-child(2){background:#f5e3eb9c}
    .card:hover{transform:translateY(-5px);border-color:#bc6c8c;box-shadow:0 18px 35px #78435a12}
    .card:focus-visible{outline:3px solid var(--pink);outline-offset:5px}
    .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:29px}
    .icon{width:46px;height:46px;border:1px solid #e4c5d1;border-radius:14px;display:grid;place-items:center;background:#fff8fb}
    .icon svg{width:24px;height:24px;stroke:#a64b70;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .number{font-family:Georgia,serif;color:#a78191;font-size:14px;font-style:italic}
    h2{font-size:29px;font-weight:500;letter-spacing:-.04em;margin:0 0 6px}
    .desc{font-size:13px;color:var(--muted);margin:0 0 26px;line-height:1.7}
    .card-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px;margin-top:auto;font-size:12px;color:#8b4966;font-weight:600}
    .arrow{font-size:21px;font-weight:400;line-height:1;transition:transform .22s}
    .card:hover .arrow{transform:translate(2px,-2px)}
    footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:22px 0 36px;color:var(--muted);font-size:11px;line-height:1.8}
    footer span:first-child{letter-spacing:.16em;font-size:10px}
    @media(min-width:1500px){.shell{width:1100px}main{max-height:900px;margin:auto 0;width:100%}}
    @media(max-width:650px){body:before{inset:10px;border-radius:20px}.shell{width:calc(100% - 52px)}header{padding-top:30px}.header-note{font-size:9px;letter-spacing:.08em}main{padding:40px 0 32px}.intro{margin-bottom:28px}.intro p{font-size:13px}.bloom{width:58px;height:58px;right:0;top:3px}h1{margin-top:20px}.links{grid-template-columns:1fr;gap:16px}.card{padding:23px;min-height:225px}.card-top{margin-bottom:19px}.desc{margin-bottom:19px}footer{flex-direction:column;gap:5px;padding-bottom:29px}}
    @media(prefers-reduced-motion:reduce){.card,.arrow{transition:none}}
  </style>
</head>
